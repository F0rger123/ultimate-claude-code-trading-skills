<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ultimate Claude Code Trading Skills: backtest, forward test, paper, live with guardrails">
  <style>
    .c{animation:rise 2.4s cubic-bezier(.4,0,.2,1) both}
    .w{fill:#fff}.b{fill:#0a0a0a;stroke:#fff;stroke-width:2}
    .line{stroke:#1fa34a;stroke-width:3;fill:none;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s .6s ease forwards}
    .t{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#fff}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a3a3a3}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @media (prefers-reduced-motion:reduce){.c,.line{animation:none;opacity:1;stroke-dashoffset:0}}
  </style>
  <rect width="1200" height="320" fill="#0a0a0a"/>
